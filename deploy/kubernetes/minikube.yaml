# Local single-node minikube variant of deploy/kubernetes/hangfire-raft.yaml.
#
# Differences from the production manifest:
#   - image: a locally built tag (hangfire-raft-sample:local) with imagePullPolicy: IfNotPresent,
#     so it uses the image loaded into minikube instead of pulling from a registry.
#   - soft (preferred) pod anti-affinity instead of required, so all three Raft nodes fit on the one
#     minikube node. NOTE: co-locating the replicas means this is NOT a real fault-tolerance test —
#     it exercises bootstrap, DNS, per-pod WAL, election, and forwarding, but a single node failure
#     takes the whole cluster. For real spreading use `minikube start --nodes 3` with the production
#     manifest, or a real cluster.
#   - smaller resource requests.
#   - no PodDisruptionBudget (see the note at the bottom of this file).
#
# Build + load the image, then apply:
#   docker build -f samples/Hangfire.Raft.K8sSample/Dockerfile -t hangfire-raft-sample:local .
#   minikube image load hangfire-raft-sample:local
#   kubectl apply -f deploy/kubernetes/minikube.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: jobs
---
apiVersion: v1
kind: Service
metadata:
  name: hangfire
  namespace: jobs
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: hangfire
  ports:
    - name: raft
      port: 5000
    - name: raft-rpc
      port: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: hangfire-dashboard
  namespace: jobs
spec:
  selector:
    app: hangfire
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hangfire
  namespace: jobs
spec:
  serviceName: hangfire
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: hangfire
  template:
    metadata:
      labels:
        app: hangfire
    spec:
      securityContext:            # drop root: the pod and its WAL must not run/own as uid 0
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault    # required by the "restricted" Pod Security Standard
        # fsGroup makes the PVC-backed /data/wal group-owned by this gid so the non-root user
        # (runAsUser on the container) can write the write-ahead log. It must match runAsUser and the
        # Dockerfile USER, or the node fails to open the WAL.
        fsGroup: 64198
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:  # soft: prefer spreading, but allow co-location on one node
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: hangfire
      terminationGracePeriodSeconds: 45   # > SubmitTimeout (30s) + WAL-close, so SIGKILL never lands mid-close
      containers:
        - name: app
          image: hangfire-raft-sample:local
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RAFT_SERVICE
              value: hangfire
            - name: RAFT_REPLICAS
              value: "3"
            - name: RAFT_WAL_PATH
              value: /data/wal
          ports:
            - name: raft
              containerPort: 5000
            - name: raft-rpc
              containerPort: 5001
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: wal
              mountPath: /data/wal
            - name: tmp
              mountPath: /tmp             # writable scratch for the .NET diagnostics socket under a read-only root
          # Startup probe gates liveness/readiness until WAL replay finishes and the HTTP listener binds;
          # liveness then watches /health, which fails only on a faulted state machine (mirrors production).
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health              # 503 only when the state machine has faulted -> recycle the pod
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready               # 200 only when the node can reach a leader (has quorum)
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 64198              # matches fsGroup above and the Dockerfile USER (keeps /data/wal writable)
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true  # the app writes only to the WAL PVC and the /tmp emptyDir above
            capabilities:
              drop: [ "ALL" ]
      volumes:
        - name: tmp               # ephemeral scratch so the container root can stay read-only
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: wal
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
# No PodDisruptionBudget here on purpose: on a single-node cluster a "minAvailable: 2" budget cannot
# protect against the one node failing (all three replicas share it) and would only block a
# `kubectl drain` of that node. The production manifest (hangfire-raft.yaml) keeps the PDB, where it
# is meaningful across multiple nodes.
