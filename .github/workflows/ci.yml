name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Install the exact SDK pinned in global.json; Dependabot's dotnet-sdk updater keeps it current.
          global-json-file: global.json
          # Cache the restored NuGet packages, keyed on the committed lock files.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        # --locked-mode fails the build if any packages.lock.json is missing or out of date, so the
        # restore is reproducible and a forgotten lock-file update cannot slip through.
        run: dotnet restore Hangfire.Raft.slnx --locked-mode

      - name: Build
        run: dotnet build Hangfire.Raft.slnx -c Release --no-restore

      - name: Enable automated test report artifact upload
        # ACTIONS_RUNTIME_TOKEN and ACTIONS_RESULTS_URL are only exposed to JS/Docker action handlers, not
        # to shell `run:` steps, so the Microsoft.Testing.Platform test process cannot upload its report
        # artifacts on its own. Re-export them into the job environment so the next step's `dotnet test` can.
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Test
        # Run the write-ahead logs on tmpfs so the fsync-on-every-commit clusters do not contend on the
        # runner's disk, which otherwise pushes co-located cluster tests past their election/submit
        # deadlines. This changes only where the WAL bytes live, not any test behaviour.
        # The test project runs on Microsoft.Testing.Platform (TUnit), opted in via global.json, so this
        # uses the native MTP `dotnet test` syntax: --solution, and --report-trx instead of --logger trx.
        env:
          HANGFIRE_RAFT_TEST_WAL_ROOT: /dev/shm
        run: >
          dotnet test --solution Hangfire.Raft.slnx -c Release --no-build
          --report-trx --report-trx-filename test-results.trx
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults/*.trx
          if-no-files-found: ignore
