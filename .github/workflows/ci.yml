name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Hangfire.Raft.slnx

      - name: Build
        run: dotnet build Hangfire.Raft.slnx -c Release --no-restore

      - name: Test
        # Run the write-ahead logs on tmpfs so the fsync-on-every-commit clusters do not contend on the
        # runner's disk, which otherwise pushes co-located cluster tests past their election/submit
        # deadlines. This changes only where the WAL bytes live, not any test behaviour.
        # The test project runs on Microsoft.Testing.Platform (TUnit), opted in via global.json, so this
        # uses the native MTP `dotnet test` syntax: --solution, and --report-trx instead of --logger trx.
        env:
          HANGFIRE_RAFT_TEST_WAL_ROOT: /dev/shm
        run: >
          dotnet test --solution Hangfire.Raft.slnx -c Release --no-build
          --report-trx --report-trx-filename test-results.trx
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults/*.trx
          if-no-files-found: ignore
