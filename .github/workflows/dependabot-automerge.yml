name: Dependabot auto-merge

# Turns on auto-merge for Dependabot PRs so each one merges itself once the required status checks
# pass (the CI "Build & Test" job). This needs two repo settings to actually wait for CI:
#   1. "Allow auto-merge" enabled on the repository.
#   2. A branch-protection rule on main that marks "Build & Test" as a required status check.
# Without the required check, GitHub merges immediately instead of waiting for CI to go green.

on: pull_request

# Dependabot-triggered runs get a read-only token by default; these grant the GITHUB_TOKEN the rights
# to approve the merge. Custom secrets are still withheld, which is fine: only GITHUB_TOKEN is used.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Enable auto-merge
        # `--auto` queues the merge; GitHub completes it only after the required CI check is green.
        # To stop auto-merging major bumps, gate this on
        # steps.metadata.outputs.update-type != 'version-update:semver-major'.
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
