name: Dependabot auto-merge

# Turns on auto-merge for Dependabot PRs so each one merges itself once the required status checks
# pass (the CI "Build & Test" job). This needs two repo settings to actually wait for CI:
#   1. "Allow auto-merge" enabled on the repository.
#   2. A branch-protection rule on main that marks "Build & Test" as a required status check.
# Without the required check, GitHub merges immediately instead of waiting for CI to go green.
#
# Dependabot only rewrites the lock files of the projects whose PackageReference it changed. A project
# that gets the package through a ProjectReference (the samples, and the tests when TUnit is not part
# of the same bump) keeps a stale lock file, which fails the --locked-mode restore in CI. The
# refresh-lock-files job regenerates them all, so such a PR can still merge itself.

on: pull_request

# Dependabot-triggered runs get a read-only token by default; these grant the GITHUB_TOKEN the rights
# to approve the merge. Custom secrets are still withheld, which is fine: only GITHUB_TOKEN is used.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-lock-files:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # Job-level permissions replace the workflow-level ones. actions: write dispatches the CI run.
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Regenerate lock files
        run: dotnet restore Hangfire.Raft.slnx --force-evaluate

      - name: Commit and re-run CI
        # [dependabot skip] lets Dependabot keep rebasing the PR despite the extra commit.
        run: |
          git add '**/packages.lock.json'
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): refresh lock files [dependabot skip]'
          git push
          gh workflow run ci.yml --ref "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge
        # `--auto` queues the merge; GitHub completes it only after the required CI check is green.
        # --rebase matches the repo's only enabled merge method. To stop auto-merging major bumps,
        # gate this on steps.metadata.outputs.update-type != 'version-update:semver-major'.
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
