# Dependabot keeps NuGet packages and GitHub Actions versions up to date.
#
# Minor and patch updates are grouped into a single PR per ecosystem to cut noise; major updates open
# their own PR so the breaking-change surface stays visible. The dependabot-auto-merge workflow turns
# on auto-merge for every Dependabot PR, so each one merges itself once the CI "Build & Test" check
# passes.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
