# Dependabot keeps the .NET SDK (global.json), NuGet packages and GitHub Actions versions up to date.
#
# Minor and patch updates are grouped into a single PR per ecosystem to cut noise; major updates open
# their own PR so the breaking-change surface stays visible. The dependabot-auto-merge workflow turns
# on auto-merge for every Dependabot PR, so each one merges itself once the CI "Build & Test" check
# passes.
version: 2
updates:
  # Bumps the SDK version pinned in global.json, which setup-dotnet installs in CI. The dotnet-sdk
  # ecosystem only does version updates (no security updates) and targets global.json files.
  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # DotNext 6.x is a breaking rewrite of the write-ahead log; the upgrade is parked on the
      # dotnext-6-migration branch pending a deliberate migration, so do not auto-propose 6.x here.
      # Minor/patch updates within the current major line are still picked up.
      - dependency-name: "DotNext.Net.Cluster"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
